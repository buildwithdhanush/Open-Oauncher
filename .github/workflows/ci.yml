name: OpenLauncher CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Android Build & Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"
      ORG_GRADLE_PROJECT_PAPPUS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          license: "true"
          packages: "platform-tools,platforms;android-34,build-tools;34.0.0"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/cache
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradlew', '**/*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Gradle wrapper validation
        run: ./gradlew --version

      - name: Grant permissions for Android instruments
        run: chmod -R 777 /tmp/android

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon
        # APK path: app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Run Android Lint
        run: ./gradlew lint --no-daemon --xml

      - name: Upload APK artifact
        if: always() && success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Lint results
        if: always() && success()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint/*.xml

      - name: Upload test results
        if: always() && success()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

  lint:
    name: Detailed Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          license: "true"
          packages: "platform-tools,platforms;android-34,build-tools;34.0.0"
      - run: chmod +x gradlew
      - run: ./gradlew lint --no-daemon

  test:
    name: Instrumentation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          license: "true"
          packages: "platform-tools,platforms;android-34,build-tools;34.0.0"
      - run: chmod +x gradlew
      - name: Run instrumentation tests
        run: ./gradlew connectedAndroidTest --no-daemon
        if: runner.os == 'Linux' && env.ANDROID_DEVICE_CONNECTED != 'false'
      - name: Upload test results
        if: always() && success()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/